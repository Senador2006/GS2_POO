spring.application.name=territory-predictive-insights

# Aplicação de console: sem servidor web e sem banner, para o menu ficar legível
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# H2 em ARQUIVO (./data/territorio.mv.db): os dados sobrevivem ao reiniciar.
# (H2 em memória perderia tudo ao fechar, o que quebra o requisito "Histórico Persistido".)
spring.datasource.url=jdbc:h2:file:./data/territorio
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas MEDICAO e ALERTA a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Código de acesso exigido para alterar limiares (DadosTerritorio)
territorio.codigo-acesso=2026

# Pasta onde o menu (opção 3 -> 3) grava o histórico exportado em CSV
territorio.pasta-exportacao=exportacoes
